<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白物 · 素材排版</title><style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui,'Microsoft YaHei',sans-serif;color:#46483f;background:#f5f4f0}button,input,select{font:inherit}button,.file{border:1px solid #d9ddd1;background:#fff;color:#59614f;border-radius:7px;padding:9px 12px;cursor:pointer}button:hover,.file:hover{background:#edf1e6}button:disabled{opacity:.4;cursor:default}.primary{background:#7a896b;color:white}header{height:70px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid #dedfd7;background:#fff}.brand{font:24px serif;letter-spacing:3px;margin-right:20px}.spacer{flex:1}.file input{display:none}.layout{display:grid;grid-template-columns:220px 1fr 235px;height:calc(100vh - 105px)}aside{background:#fff;padding:20px;border-right:1px solid #dedfd7;overflow:auto}aside.right{border-left:1px solid #dedfd7;border-right:0}h2{font-size:13px;font-weight:500;margin:0 0 18px}label.field{display:block;margin:15px 0;color:#868b7e}input[type=number],select{width:100%;margin-top:7px;padding:8px;border:1px solid #dfe3d7;border-radius:6px;background:white;color:#4d5841}input[type=range]{width:100%;accent-color:#839373}input[type=color]{width:100%;height:33px;border:1px solid #ddd;background:white}.row{display:flex;gap:6px;margin:9px 0}.row>*{flex:1;min-width:0}.workspace{overflow:auto;display:flex;align-items:center;justify-content:center;padding:45px;position:relative;background:#eeeee8;background-image:radial-gradient(#d3d6ca .7px,transparent .7px);background-size:16px 16px}.board-wrap{position:relative;flex:none;box-shadow:0 8px 36px #343c2315}.board{position:relative;overflow:hidden;touch-action:none;background-color:white;transform-origin:top left}.checker{background-image:linear-gradient(45deg,#e7e7e7 25%,transparent 25%),linear-gradient(-45deg,#e7e7e7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e7e7e7 75%),linear-gradient(-45deg,transparent 75%,#e7e7e7 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.item{position:absolute;touch-action:none;user-select:none;cursor:move;outline:1.5px solid transparent}.item img{width:100%;height:100%;display:block;pointer-events:none}.item.selected{outline-color:#899e75}.handle{display:none;position:absolute;bottom:-7px;right:-7px;width:14px;height:14px;border:2px solid white;background:#81976c;box-shadow:0 0 0 1px #81976c;cursor:nwse-resize}.selected .handle{display:block}.layer{display:flex;align-items:center;gap:8px;border:1px solid #e4e6dc;border-radius:7px;padding:8px;margin:7px 0;cursor:pointer;background:#fafbf7}.layer.active{border-color:#859970;background:#edf2e7}.layer img{width:30px;height:30px;object-fit:contain;background:#f0f0ec}.layer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{font-size:11px;color:#969d8b;line-height:1.9}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;color:#a2aa98}.empty b{font:25px serif;font-weight:400;margin-bottom:14px}.bottom{height:35px;padding:8px 24px;border-top:1px solid #dedfd7;display:flex;justify-content:space-between;color:#929988;font-size:11px}.zoom{display:flex;align-items:center;gap:8px}#layers:empty:after{content:'导入图片后，在这里管理图层';font-size:11px;color:#9bA28f}#properties[hidden]{display:none}a{color:#7a896b;text-decoration:none}@media(max-width:900px){.layout{grid-template-columns:170px 1fr}.right{grid-column:1/-1;border-top:1px solid #ddd;max-height:200px}.layout{height:auto;min-height:calc(100vh - 105px)}.workspace{min-height:65vh;padding:20px}header{padding:10px;height:auto;flex-wrap:wrap}.brand{font-size:18px}.bottom{height:auto}.zoom{display:none}}
[hidden]{display:none!important}.item img{transform-origin:center}.active-toggle{background:#e5eddc;border-color:#82956c}</style></head><body><header><span class="brand">白物 <small style="font:12px system-ui;letter-spacing:1px">素材排版</small></span><label class="file primary">＋ 导入素材<input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><button id="undo" title="Ctrl+Z">撤销</button><button id="redo" title="Ctrl+Shift+Z">重做</button><span class="spacer"></span><button id="save">保存布局</button><label class="file">打开布局<input id="project" type="file" accept="application/json,.json"></label><button class="primary" id="export">↓ 导出 PNG</button></header><div class="layout"><aside><h2>画布设置</h2><div class="row"><label class="field">宽度<input id="cw" type="number" min="100" max="6000" value="1200"></label><label class="field">高度<input id="ch" type="number" min="100" max="6000" value="900"></label></div><button id="applySize" style="width:100%">应用尺寸</button><label class="field">背景<select id="bgMode"><option value="transparent">透明</option><option value="color">纯色</option></select></label><input id="bgColor" type="color" value="#f2edf5" aria-label="画布背景色"><p class="hint">PNG 透明素材可自然叠放。<br>原图带白底时，白底也会保留。</p><hr style="border:0;border-top:1px solid #e5e7de;margin:25px 0"><h2>图层 <span class="hint">上方显示在最前</span></h2><div id="layers"></div></aside><main class="workspace" id="workspace"><div class="board-wrap" id="wrap"><div class="board checker" id="board"><div class="empty" id="empty"><b>把喜欢的物品，放在一起。</b><span>导入图片，拖动位置 · 拖右下角缩放</span></div></div></div></main><aside class="right"><h2>选中素材</h2><p class="hint" id="nothing">点击画布上的图片或左侧图层。</p><div id="properties" hidden><p id="name" style="overflow-wrap:anywhere"></p><div class="row"><label class="field">X<input id="px" type="number"></label><label class="field">Y<input id="py" type="number"></label></div><label class="field">大小 <output id="scaleText"></output><input id="scale" type="range" min="5" max="300" value="100"></label><p class="hint">按原图比例缩放</p><label class="field">旋转角度（°）<input id="angle" type="number" step="1" min="-180" max="180" value="0"></label><input id="rotation" type="range" min="-180" max="180" step="1" value="0" aria-label="旋转角度"><div class="row"><button id="rotateLeft">↶ 左转90°</button><button id="rotateRight">↷ 右转90°</button></div><div class="row"><button id="flipX" aria-pressed="false">水平翻转</button><button id="flipY" aria-pressed="false">垂直翻转</button></div><button id="resetTransform" style="width:100%">重置旋转与翻转</button><div class="row"><button id="front">置顶</button><button id="back">置底</button></div><div class="row"><button id="up">上一层</button><button id="down">下一层</button></div><div class="row"><button id="center">居中</button><button id="copy">复制</button></div><button id="remove" style="width:100%;color:#a16f74">移除素材</button></div><p class="hint" style="margin-top:25px">方向键微调，Shift + 方向键移动10px。<br>Delete 删除选中素材。<br>保存布局可保留图片和图层顺序，之后继续编辑。</p></aside></div><div class="bottom"><span id="status" role="status">所有图片只在本地处理。</span><span class="zoom">显示缩放 <input id="zoom" type="range" min="10" max="120" value="50"><output id="zoomText">50%</output></span></div><script>
const $=s=>document.querySelector(s),board=$('#board');let state={version:1,width:1200,height:900,background:null,items:[]},selected=null,zoom=.5,history=[],future=[],gesture=null,uid=0;const cache=new Map();const current=()=>state.items.find(i=>i.id===selected);const clone=()=>JSON.stringify(state);function checkpoint(){history.push(clone());if(history.length>35)history.shift();future=[];buttons();}function buttons(){$('#undo').disabled=!history.length;$('#redo').disabled=!future.length;}function status(t){$('#status').textContent=t;}
function fit(){const box=$('#workspace').getBoundingClientRect();zoom=Math.max(.1,Math.min(1,(box.width-70)/state.width,(box.height-70)/state.height));$('#zoom').value=Math.round(zoom*100);view();}function view(){board.style.width=state.width+'px';board.style.height=state.height+'px';board.style.transform='scale('+zoom+')';$('#wrap').style.width=state.width*zoom+'px';$('#wrap').style.height=state.height*zoom+'px';$('#zoomText').textContent=Math.round(zoom*100)+'%';}
function properties(){const i=current();$('#properties').hidden=!i;$('#nothing').hidden=!!i;if(!i)return;$('#name').textContent=i.name;$('#px').value=Math.round(i.x);$('#py').value=Math.round(i.y);const s=Math.round(i.w/i.nw*100);$('#scale').value=Math.min(300,Math.max(5,s));$('#scaleText').textContent=s+'%';$('#angle').value=Math.round(i.rotation||0);$('#rotation').value=i.rotation||0;for(const key of ['flipX','flipY']){$('#'+key).setAttribute('aria-pressed',!!i[key]);$('#'+key).classList.toggle('active-toggle',!!i[key]);}}
function render(){board.querySelectorAll('.item').forEach(n=>n.remove());$('#layers').replaceChildren();state.items.forEach(i=>{const el=document.createElement('div');el.className='item'+(i.id===selected?' selected':'');el.dataset.id=i.id;Object.assign(el.style,{left:i.x+'px',top:i.y+'px',width:i.w+'px',height:i.h+'px',transform:'rotate('+(i.rotation||0)+'deg)'});const im=document.createElement('img');im.src=i.src;im.alt=i.name;im.style.transform='scale('+(i.flipX?-1:1)+','+(i.flipY?-1:1)+')';const handle=document.createElement('span');handle.className='handle';el.append(im,handle);board.append(el);});[...state.items].reverse().forEach(i=>{const row=document.createElement('div');row.className='layer'+(i.id===selected?' active':'');const im=document.createElement('img');im.src=i.src;const name=document.createElement('span');name.textContent=i.name;row.append(im,name);row.onclick=()=>{selected=i.id;render();};$('#layers').append(row);});board.classList.toggle('checker',!state.background);board.style.backgroundColor=state.background||'#fff';$('#empty').hidden=!!state.items.length;$('#cw').value=state.width;$('#ch').value=state.height;$('#bgMode').value=state.background?'color':'transparent';if(state.background)$('#bgColor').value=state.background;properties();buttons();view();}
function image(src){if(cache.has(src))return cache.get(src);const p=new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(Error('图片无法读取'));im.src=src;});cache.set(src,p);return p;}function dataURL(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f);});}async function importImages(files){const ready=[];for(const f of files){if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>25*1024*1024){status('跳过不支持或超过25MB的图片：'+f.name);continue;}try{const src=await dataURL(f),im=await image(src),k=Math.min(1,state.width*.45/im.width,state.height*.65/im.height);ready.push({id:'i'+Date.now()+'-'+uid++,name:f.name,src,nw:im.width,nh:im.height,w:im.width*k,h:im.height*k,x:(state.width-im.width*k)/2+ready.length*15,y:(state.height-im.height*k)/2+ready.length*15});}catch(e){status('无法读取 '+f.name);}}if(ready.length){checkpoint();state.items.push(...ready);selected=ready.at(-1).id;render();status('已导入 '+ready.length+' 张素材，可拖动和缩放。');}}
$('#images').onchange=e=>{importImages([...e.target.files]);e.target.value='';};board.onpointerdown=e=>{if(e.button!==0)return;const el=e.target.closest('.item');if(!el){selected=null;render();return;}selected=el.dataset.id;const i=current();checkpoint();gesture={id:e.pointerId,resize:e.target.classList.contains('handle'),x:e.clientX,y:e.clientY,old:{...i}};board.setPointerCapture(e.pointerId);render();e.preventDefault();};board.onpointermove=e=>{if(!gesture||gesture.id!==e.pointerId)return;const i=current(),dx=(e.clientX-gesture.x)/zoom,dy=(e.clientY-gesture.y)/zoom;if(gesture.resize){const old=gesture.old,a=(old.rotation||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a),lx=dx*c+dy*s,ly=-dx*s+dy*c,ratio=old.h/old.w,d=(lx+ly*ratio)/(1+ratio*ratio);i.w=Math.max(15,Math.min(12000,old.w+d));i.h=i.w*i.nh/i.nw;const ax=old.x+old.w/2-(old.w*c-old.h*s)/2,ay=old.y+old.h/2-(old.w*s+old.h*c)/2;i.x=ax+(i.w*c-i.h*s)/2-i.w/2;i.y=ay+(i.w*s+i.h*c)/2-i.h/2;}else{i.x=gesture.old.x+dx;i.y=gesture.old.y+dy;}const el=board.querySelector('.selected');Object.assign(el.style,{left:i.x+'px',top:i.y+'px',width:i.w+'px',height:i.h+'px'});properties();};function endGesture(){gesture=null;}board.onpointerup=endGesture;board.onpointercancel=endGesture;
function normalizedAngle(v){return ((v+180)%360+360)%360-180;}function setAngle(v){if(Number.isFinite(v))mutate(i=>i.rotation=normalizedAngle(v));}$('#angle').onchange=e=>setAngle(Number(e.target.value));$('#rotation').onpointerdown=()=>{if(current())checkpoint();};$('#rotation').onkeydown=e=>{if(current()&&(e.key.startsWith('Arrow')||e.key==='Home'||e.key==='End'))checkpoint();};$('#rotation').oninput=e=>{if(!current())return;current().rotation=Number(e.target.value);render();};$('#rotateLeft').onclick=()=>mutate(i=>i.rotation=normalizedAngle((i.rotation||0)-90));$('#rotateRight').onclick=()=>mutate(i=>i.rotation=normalizedAngle((i.rotation||0)+90));for(const key of ['flipX','flipY'])$('#'+key).onclick=()=>mutate(i=>i[key]=!i[key]);$('#resetTransform').onclick=()=>mutate(i=>{i.rotation=0;i.flipX=false;i.flipY=false;});function mutate(fn){if(!current())return;checkpoint();fn(current());render();}function order(to){mutate(i=>{const ix=state.items.indexOf(i);state.items.splice(ix,1);state.items.splice(to(ix),0,i);});}$('#front').onclick=()=>order(()=>state.items.length);$('#back').onclick=()=>order(()=>0);$('#up').onclick=()=>order(ix=>Math.min(state.items.length,ix+1));$('#down').onclick=()=>order(ix=>Math.max(0,ix-1));$('#center').onclick=()=>mutate(i=>{i.x=(state.width-i.w)/2;i.y=(state.height-i.h)/2;});$('#copy').onclick=()=>mutate(i=>{const next={...i,id:'i'+Date.now()+'-'+uid++,x:i.x+20,y:i.y+20};state.items.push(next);selected=next.id;});$('#remove').onclick=()=>mutate(i=>{state.items.splice(state.items.indexOf(i),1);selected=null;});for(const [id,key]of [['px','x'],['py','y']])$('#'+id).onchange=e=>{const v=Number(e.target.value);if(Number.isFinite(v))mutate(i=>i[key]=v);};$('#scale').onpointerdown=()=>{if(current())checkpoint();};$('#scale').onkeydown=e=>{if(current()&&e.key.startsWith('Arrow'))checkpoint();};$('#scale').oninput=e=>{const i=current();if(!i)return;const cx=i.x+i.w/2,cy=i.y+i.h/2;i.w=i.nw*Number(e.target.value)/100;i.h=i.nh*Number(e.target.value)/100;i.x=cx-i.w/2;i.y=cy-i.h/2;render();};$('#undo').onclick=()=>{if(!history.length)return;future.push(clone());state=JSON.parse(history.pop());selected=null;render();};$('#redo').onclick=()=>{if(!future.length)return;history.push(clone());state=JSON.parse(future.pop());selected=null;render();};$('#applySize').onclick=()=>{const w=Number($('#cw').value),h=Number($('#ch').value);if(!Number.isInteger(w)||!Number.isInteger(h)||w<100||h<100||w>6000||h>6000){status('画布宽高请设为100至6000的整数。');return;}checkpoint();state.width=w;state.height=h;render();fit();};function background(){checkpoint();state.background=$('#bgMode').value==='color'?$('#bgColor').value:null;render();}$('#bgMode').onchange=background;$('#bgColor').onchange=background;$('#zoom').oninput=e=>{zoom=Number(e.target.value)/100;view();};
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}$('#save').onclick=()=>{download(new Blob([clone()],{type:'application/json'}),'白物-素材布局.json');status('布局已下载，包含素材图片和图层顺序。');};$('#project').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>150*1024*1024)throw Error('布局文件过大');const s=JSON.parse(await f.text());if(s.version!==1||!Number.isInteger(s.width)||!Number.isInteger(s.height)||s.width<100||s.height<100||s.width>6000||s.height>6000||!Array.isArray(s.items)||s.items.length>150||!(s.background===null||/^#[0-9a-f]{6}$/i.test(s.background)))throw Error('布局格式不支持');const ids=new Set();for(const i of s.items){if(typeof i.id!=='string'||ids.has(i.id)||typeof i.name!=='string'||!/^data:image\/(png|jpeg|webp);base64,/.test(i.src)||!['x','y','w','h','nw','nh'].every(k=>Number.isFinite(i[k]))||i.w<=0||i.h<=0||i.nw<=0||i.nh<=0||i.w>12000||i.h>12000)throw Error('素材数据无效');if(i.rotation!==undefined&&!Number.isFinite(i.rotation)||i.flipX!==undefined&&typeof i.flipX!=='boolean'||i.flipY!==undefined&&typeof i.flipY!=='boolean')throw Error('旋转或翻转数据无效');i.rotation=normalizedAngle(i.rotation||0);i.flipX=!!i.flipX;i.flipY=!!i.flipY;ids.add(i.id);await image(i.src);}checkpoint();state=s;selected=null;render();fit();status('布局已恢复，可继续编辑。');}catch(err){status('打开失败：'+err.message);}};
$('#export').onclick=async()=>{try{status('正在导出…');const c=document.createElement('canvas');c.width=state.width;c.height=state.height;const ctx=c.getContext('2d');if(state.background){ctx.fillStyle=state.background;ctx.fillRect(0,0,c.width,c.height);}const exportItems=state.items.map(i=>({...i}));for(const i of exportItems){const im=await image(i.src);ctx.save();ctx.translate(i.x+i.w/2,i.y+i.h/2);ctx.rotate((i.rotation||0)*Math.PI/180);ctx.scale(i.flipX?-1:1,i.flipY?-1:1);ctx.drawImage(im,-i.w/2,-i.h/2,i.w,i.h);ctx.restore();}c.toBlob(blob=>{if(!blob){status('导出失败，请缩小画布。');return;}download(blob,'白物-素材排版.png');status('PNG已导出，图层选择框不会出现在图片中。');},'image/png');}catch(e){status('导出失败：'+e.message);}};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();(e.shiftKey?$('#redo'):$('#undo')).click();return;}if(!current())return;if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();$('#remove').click();}const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(d){e.preventDefault();mutate(i=>{i.x+=d[0]*(e.shiftKey?10:1);i.y+=d[1]*(e.shiftKey?10:1);});}});$('#workspace').ondragover=e=>e.preventDefault();$('#workspace').ondrop=e=>{e.preventDefault();importImages([...e.dataTransfer.files]);};window.addEventListener('resize',fit);render();fit();
</script></body></html>
